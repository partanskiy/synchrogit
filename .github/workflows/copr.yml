name: Update COPR

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copr-publish
  cancel-in-progress: false

jobs:
  update-copr:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Default-branch code only; never execute a workflow_run's checkout.
      - uses: actions/checkout@v4
      - name: Request one build of the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: python3 scripts/publish_copr.py
