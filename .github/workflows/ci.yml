name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
      - name: Test embedded Git backend
        run: cargo test --all --locked
        env:
          SYNCHROGIT_GIT_BACKEND: embedded

  windows-package:
    name: Windows archive
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package and inspect scripts
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw $errors }
          }
          ./scripts/package-windows.ps1 -Version 'ci'
      - uses: actions/upload-artifact@v4
        with:
          name: synchrogit-windows
          path: dist/*

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain and lowdown
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools lowdown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package .deb and .rpm (release-path validation)
        run: |
          mkdir -p target/man dist
          lowdown -s -Tman docs/synchrogit.1.md -o target/man/synchrogit.1
          cargo deb --no-build --target ${{ matrix.target }} -o dist/
          cargo generate-rpm --target ${{ matrix.target }} -o dist/
          ls -l dist/

  nix:
    name: nix-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix build .# --print-build-logs

  msrv:
    name: msrv-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git lowdown perl
      - uses: actions/checkout@v4
      - name: Build and inspect the source package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p /tmp/arch-package
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="synchrogit-$version/" HEAD > "/tmp/arch-package/synchrogit-$version.tar"
          gzip "/tmp/arch-package/synchrogit-$version.tar"
          sed -e "s|@PKGVER@|$version|g" \
              -e 's|@REPO_URL@|https://github.com/partanskiy/synchrogit|g' \
              -e "s|@SOURCE_URL@|synchrogit-$version.tar.gz|g" \
              -e "s|@SOURCE_SHA256@|$(sha256sum /tmp/arch-package/*.tar.gz | cut -d' ' -f1)|g" \
              packaging/aur/synchrogit/PKGBUILD.in > /tmp/arch-package/PKGBUILD
          # Local fixture source, avoiding an unpublished tag during PR builds.
          sed -i 's|::synchrogit-|::file:///tmp/arch-package/synchrogit-|' /tmp/arch-package/PKGBUILD
          chown -R nobody:nobody /tmp/arch-package
          runuser -u nobody -- env CARGO_HOME=/tmp/arch-package/.cargo sh -c 'cd /tmp/arch-package && makepkg --noconfirm --cleanbuild'
          pacman -U --noconfirm /tmp/arch-package/*.pkg.tar.zst
          synchrogit --version
          SYNCHROGIT_GIT_BACKEND=embedded synchrogit backend
          pacman -Ql synchrogit
